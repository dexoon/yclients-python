# Публикация в PyPI через trusted publishing (OIDC, без токенов в секретах).
#
# Разовая настройка на pypi.org: Your account -> Publishing -> добавить
# pending publisher: GitHub (dexoon/yclients-python, workflow publish.yml,
# environment pypi). После этого публикация -- просто создание GitHub Release.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # для trusted publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
